name: release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v3.0.0)
        required: true
        type: string

jobs:
  build:
    name: ${{ matrix.job.name }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - name: macOS-x86_64
            os: macos-26
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            arch: x64

          - name: macOS-aarch64
            os: macos-26
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            arch: aarch64

          - name: Windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            arch: x64

          - name: Windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-aarch64
            arch: arm64

          - name: Linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            arch: amd64

          - name: Linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.job.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils -y
          sudo apt install libclang-dev libkrb5-dev -y

      - name: Get App version
        shell: bash
        run: |
          echo "APP_VERSION=$(node -p "require('./tauri.conf.json').version")" >> $GITHUB_ENV

      - name: Build App
        run: |
          bun run build --target ${{ matrix.job.target }}
        env:
          APPLE_SIGNING_IDENTITY: ''
          APPLE_CERTIFICATE: ''
          APPLE_ID: ''
          APPLE_PASSWORD: ''
          APPLE_TEAM_ID: ''

      - name: Stage artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          PREFIX: Dataflare-${{ env.APP_VERSION }}-${{ matrix.job.platform }}
          BUNDLE_DIR: target/${{ matrix.job.target }}/release/bundle
        run: |
          mkdir -p dist
          mv "$BUNDLE_DIR/dmg/Dataflare_${{ env.APP_VERSION }}_${{ matrix.job.arch }}.dmg" "dist/$PREFIX.dmg"
          mv "$BUNDLE_DIR/macos/Dataflare.app.tar.gz" "dist/$PREFIX.app.tar.gz"

      - name: Stage artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PREFIX: Dataflare-${{ env.APP_VERSION }}-${{ matrix.job.platform }}
          BUNDLE_DIR: target/${{ matrix.job.target }}/release/bundle
        run: |
          mkdir -p dist
          mv "$BUNDLE_DIR/deb/"*.deb "dist/$PREFIX.deb"

      - name: Stage artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          PREFIX: Dataflare-${{ env.APP_VERSION }}-${{ matrix.job.platform }}
          BUNDLE_DIR: target/${{ matrix.job.target }}/release/bundle
        run: |
          mkdir -p dist
          mv "$BUNDLE_DIR/nsis/Dataflare_${{ env.APP_VERSION }}_${{ matrix.job.arch }}-setup.exe" "dist/$PREFIX-setup.exe"
          mv "$BUNDLE_DIR/nsis/Dataflare_${{ env.APP_VERSION }}_${{ matrix.job.arch }}-setup.nsis.zip" "dist/$PREFIX-setup.nsis.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dataflare-${{ matrix.job.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dataflare-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          make_latest: "true"
          fail_on_unmatched_files: true
          files: dist/*
